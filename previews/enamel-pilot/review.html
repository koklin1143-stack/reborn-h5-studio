<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>坐犬 · 成纹参照 · 物之再生</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#242522;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:940px;margin:auto;padding:32px 24px 55px}h1{font:500 clamp(30px,6vw,44px)/1.2 "Songti SC",SimSun,serif;margin:6px 0 8px}p{margin:5px 0 18px}.k,small{color:#565b56;font-size:13px}nav{display:flex;gap:6px;margin:16px 0 8px}button{background:white;border:1px solid #c9cbc6;min-height:44px;border-radius:7px;padding:7px 14px;font:inherit;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#252826;border-color:#252826;color:#fff}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;background:white;padding:12px}.board figure{margin:0}.board a{display:block}.board img{width:100%;height:clamp(115px,26vw,235px);display:block;object-fit:contain}figcaption{text-align:center;margin:4px 0 8px}figcaption small{display:block}h2{font-weight:500;font-size:18px;margin:20px 0 8px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:4px;max-width:570px;margin:0 auto}.pair figure{margin:0}.pair img{width:100%;display:block}details{border-top:1px solid #d3d5d0;margin-top:20px}summary{padding:11px 0;cursor:pointer;min-height:44px}a{color:#265165}aside{margin-top:24px}.archive{display:flex;gap:16px;flex-wrap:wrap}@media(max-width:600px){main{padding:17px 12px 35px}.board{gap:3px;padding:5px}.board img{height:150px}figcaption{font-size:13px}figcaption small{display:none}}.face{position:relative;overflow:hidden;aspect-ratio:1}.pair .face img{width:280%;max-width:none;position:absolute;left:-62%;top:-48%}</style></head>
<body><main><span class="k">物之再生　／　纹样试稿</span><h1>坐犬 · 成纹参照</h1><p>三张团队参照分别研究线与面的连接、实色露白、暖色柔喷。工作台依素材自动运用。</p>
<nav aria-label="试稿视图"><button type="button" data-mode="paper" aria-pressed="true">平面稿</button><button type="button" data-mode="cup" aria-pressed="false">杯身试印</button></nav>
<div class="board"><figure data-paper="selected/warm-line.png" data-cup="selected/cup-warm-line.png"><a href="selected/warm-line.png"><img src="selected/warm-line.png" alt="朱红线版平面稿"></a><figcaption>朱红喷花<small>赭红收线，眼鼻稍深</small></figcaption></figure><figure data-paper="sketch-blue.png" data-cup="cup-blue.png"><a href="sketch-blue.png"><img src="sketch-blue.png" alt="钴蓝露白平面稿"></a><figcaption>钴蓝露白<small>大面实蓝，胸前露白</small></figcaption></figure><figure data-paper="sketch-spray.png" data-cup="cup-spray.png"><a href="sketch-spray.png"><img src="sketch-spray.png" alt="暖红柔喷平面稿"></a><figcaption>暖红柔喷<small>暖红渐退，透出奶白</small></figcaption></figure></div>
<details id="blue-face"><summary>放大看收线与露白</summary><div class="pair"><figure><div class="face"><img src="selected/warm-line.png" alt="朱红的喷点与同色收线"></div><figcaption>朱红喷花</figcaption></figure><figure><div class="face"><img src="sketch-blue.png" alt="钴蓝实色与露白"></div><figcaption>钴蓝露白</figcaption></figure></div></details>
<details><summary>对照朱红稿的改线</summary><div class="pair"><figure><img src="mask-study/seated.png" alt="图一原稿"><figcaption>原稿 · 深青黑线</figcaption></figure><figure><img src="selected/warm-line.png" alt="图一校色稿"><figcaption>校色稿 · 深赭红线</figcaption></figure></div></details>
<details><summary>看同一句话生成的玉兰</summary><p>文字试验 · 一枝向左倾的玉兰，侧开一朵花，右侧一枚花苞。</p><div class="pair"><figure><a href="selected/magnolia-vermilion.png"><img src="selected/magnolia-vermilion.png" alt="朱红喷花玉兰"></a><figcaption>朱红喷花</figcaption></figure><figure><a href="selected/magnolia-cobalt.png"><img src="selected/magnolia-cobalt.png" alt="钴蓝露白玉兰"></a><figcaption>钴蓝露白</figcaption></figure></div></details><aside><p><a href="cat-check/soft-comparison.png">看眯眼猫测试草图与暖红成纹</a></p><p><a href="../../docs/enamel-pattern-rules.html">工作台生图规则</a></p><p><a href="subject-study/index.html">看朱红线版用在山茶与自行车上 →</a></p><details><summary>往期试验</summary><div class="archive"><a href="sketch-spray.png">暖红喷花原稿</a><a href="first-pilot.html">最初六张试样</a><a href="blue-study/index.html">文字与照片对照</a><a href="mask-study/index.html">分色与落位</a><a href="animal-proof/index.html">小犬逐球</a></div></details></aside></main>
<script>const board=document.querySelector('.board');document.querySelector('nav').onclick=e=>{const button=e.target.closest('button[data-mode]');if(!button)return;for(const other of document.querySelectorAll('nav button'))other.setAttribute('aria-pressed',String(other===button));for(const fig of board.children){const file=fig.dataset[button.dataset.mode],img=fig.querySelector('img');fig.querySelector('a').href=file;img.src=file;img.alt=fig.querySelector('figcaption').firstChild.textContent+(button.dataset.mode==='cup'?'杯身试印':'平面稿');}};</script></body></html>
