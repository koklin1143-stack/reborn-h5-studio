<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一枝花，一辆车 · 跨题材试样</title><style>*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#262924;font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}main{max-width:850px;margin:auto;padding:30px 24px 44px}h1{font:500 clamp(28px,6vw,42px)/1.25 "Songti SC",SimSun,serif;margin:4px 0}p{margin:6px 0 14px}small,figcaption span{font-size:13px;color:#525752}nav{display:flex;gap:6px;margin:14px 0 10px}button{font:inherit;min-height:44px;padding:5px 14px;border:1px solid #ced1cb;background:#fff;border-radius:7px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#252925;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;background:#fff;padding:10px;gap:12px}.grid figure{margin:0;min-width:0}.grid img{width:100%;height:clamp(138px,30vw,248px);object-fit:contain;display:block}figcaption{padding:4px}figcaption b,figcaption span{display:block}a{color:#285168}details{border-top:1px solid #cfd2ca;margin-top:18px}summary{cursor:pointer;min-height:44px;padding:10px 0}aside{margin:18px 0;font-size:14px}.old{width:min(260px,90%)}@media(max-width:600px){main{padding:18px 12px}.grid{padding:6px;gap:4px}figcaption span{display:none}}</style></head><body><main><small>物之再生　／　跨题材试样</small><h1>一枝花，一辆车</h1><p>从坐犬稿提取三处局部，分别看收线、退晕和线面相接。花瓣靠色面分前后，车架靠接头和留空保持清楚。</p><nav aria-label="看图方式"><button data-v="" aria-pressed="true">平面稿</button><button data-v="cup-" aria-pressed="false">杯身试印</button></nav><div id="board" class="grid"><figure data-id="flower"><a href="flower.png"><img src="flower.png" alt="折枝山茶"></a><figcaption><b>折枝山茶</b><span>瓣根积色，瓣缘露白，梗线在花托处并入色面。</span></figcaption></figure><figure data-id="wheel"><a href="wheel.png"><img src="wheel.png" alt="三弧轮自行车"></a><figcaption><b>三弧轮自行车</b><span>把细辐条归成三片弧形，车架的三角保持通透。</span></figcaption></figure></div>
<details><summary>为什么重画车轮？</summary><img class="old" src="bicycle.png" alt="多辐条自行车初稿"><p>初稿的辐条太密，轮外还有不必要的红雾。随后另画三弧轮的构图，用同一题材试更简洁的轮面。第二稿在杯面更清楚，但车架线仍较匀，略像图标。<a href="wheel-guide.svg">查看原创车轮构图</a></p></details>
<aside>花和车都是当代设计试样。百炼先从<a href="ink-samples.png">三处墨样</a>分别生成花、车，再根据车架构图重试一次。三张均通过本机 H5 的三维试贴和私有作品保存。<a href="../review.html">返回坐犬三稿</a> · <a href="study.json">首轮指令</a> · <a href="wheel-request.json">车轮重试指令</a></aside></main>
<script>document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;for(const t of document.querySelectorAll('nav button'))t.setAttribute('aria-pressed',String(t===b));for(const fig of document.querySelectorAll('#board figure')){const file=b.dataset.v+fig.dataset.id+'.png';fig.querySelector('a').href=file;fig.querySelector('img').src=file;fig.querySelector('img').alt=fig.querySelector('b').textContent+b.textContent;}};</script></body></html>
