<main><small>物之再生　/　制稿试验</small><h1>侧脸印花与露釉对照</h1>
<section><h2>同一枚印花，换回杯身底色</h2><p>用反馈图里的红纹样模拟混合透明度回图。在同一深釉杯上对照，角间与吻下的空隙能透出釉色。</p>
<div class="pair" id="matte"><figure><a class="crop" href="background-before.png"><img src="background-before.png" alt="旧处理下红纹样四周留有纸白"></a><figcaption>旧处理复现</figcaption></figure><figure><a class="crop" href="background-after.png"><img src="background-after.png" alt="红纹样直接落在深釉杯身"></a><figcaption>分离纸底后</figcaption></figure></div></section>
<section><h2>另画一张双角侧脸</h2><p>实测草图保留左向长吻和高低两角。回图由百炼生成，主色从角根落到后颈，脸颊向下方露釉。</p>
