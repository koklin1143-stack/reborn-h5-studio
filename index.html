const date=v=>new Date(v).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
const row=(title,sub,act,extra='')=>`<button class="list-row" data-action="${act}" ${extra}><span><strong>${esc(title)}</strong><small>${esc(sub)}</small></span>${icon('chevron',18)}</button>`;
const empty=(title,desc)=>`<div class="empty"><span class="empty-mark">${icon('layers',34)}</span><h2>${title}</h2><p>${desc}</p>${btn('去共创，选一件物品','home')}</div>`;
function nav(p){return ['discover','points','mine'].map((id,i)=>`<button data-action="navigate" data-page="${id}" aria-current="${p===id?'page':'false'}">${icon(['layers','award','user'][i],21)}<span>${['共创','积分','我的'][i]}</span></button>`).join('');}
function header(c){if(c.page==='editor')return `${ib('back','back','返回来源页')}<div class="header-center"><strong>创作工作台</strong><span id="save-status" role="status">${c.saveLabel}</span></div>${btn('结束','exit','text')}`;if(['discover','points','mine'].includes(c.page))return `<a class="brand" href="#discover"><span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span><span>物之再生<small>RE:BORN · INDUSTRIAL ARCHIVE</small></span></a>${btn('关于','about','header-note')}`;return `${ib('back','back','返回')}<strong class="header-center">${c.page==='detail'?'物件档案':'我的数字作品'}</strong>${tag('本地')}`;}
function detail(c){const i=c.item;return `<section class="page-content"><span class="eyebrow">OBJECT / ${String(M.items.indexOf(i)+1).padStart(3,'0')}</span><h1>${i.name}</h1><p class="lede">${i.subtitle}</p><div class="detail-art">${A.object({itemId:i.id},true)}</div><div class="definition"><span>类别</span><strong>${M.category(i.category).name} · 示意画布</strong><span>素材性质</span><strong>本原型自绘 SVG</strong><span>馆藏对应</span><strong>来源、年代待核实</strong></div><p class="body-copy">${i.description}</p><p class="notice">这是一份创作练习素材，并非已获馆方授权的藏品复制图，也不代表生产确认。</p>${btn('用这件物品开始创作','start','primary full')}${btn(c.s.favorites.includes(i.id)?'已收藏 · 取消收藏':'收藏这件物品','favorite','secondary full')}</section>`;}
function slider(label,key,value,min,max,unit=''){return `<label class="range-field"><span>${label}<output data-output="${key}">${value}${unit}</output></span><input type="range" data-field="${key}" aria-label="${label}" min="${min}" max="${max}" value="${value}"></label>`;}
function tools(c){const d=c.d;if(c.tool==='compose')return `<div class="range-grid">${slider('缩放','scale',d.scale,40,160,'%')}${slider('旋转','rotation',d.rotation,-180,180,'°')}${slider('水平位置','x',d.x,-60,60)}${slider('垂直位置','y',d.y,-60,60)}</div><p class="tool-help">移动、缩放与替换均可撤销。边缘外的图案会被裁切。</p>`;if(c.tool==='material')return `<p class="tool-label">器物底色</p><div class="swatches">${A.palette.map(p=>`<button data-action="color" data-id="${p.id}" aria-pressed="${d.color===p.id}" style="--swatch:${p.color}"><i></i>${p.name}</button>`).join('')}</div>${d.category==='enamel'?`<div class="segmented">${btn('搪瓷杯','canvas','',`data-id="cup" aria-pressed="${d.canvas==='cup'}"`)}${btn('搪瓷盘','canvas','',`data-id="plate" aria-pressed="${d.canvas==='plate'}"`)}</div>`:'<p class="tool-help">保留物件原有比例，在中心画布自由安排图案。</p>'}`;return `<div class="motif-strip">${M.items.filter(i=>i.category===d.category).map(i=>`<button data-action="replace" data-id="${i.id}" aria-pressed="${!d.imageId&&i.id===d.itemId}">${A.panel(i.pattern)}<span>${i.name}</span></button>`).join('')}</div>${btn(icon('upload',16)+' 上传／替换个人图像','upload','text full')}${d.imageId?`<span class="image-name">正在使用：${esc(d.imageName)}</span>`:''}`;}
function editor(c){const d=c.d;if(!d)return empty('没有正在编辑的草稿','选择一件物品，开始新的设计。');return `<section class="editor-screen"><div class="editor-meta"><span>${M.category(d.category).name} / ${esc(d.title||'未命名草稿')}</span><div>${ib('undo','undo','撤销',d.past.length?'':'disabled')}${ib('redo','redo','重做',d.future.length?'':'disabled')}${ib('rotate','reset','重置构图')}</div></div><div class="canvas-stage" id="canvas-stage"><div id="work-preview">${art(d)}</div><span class="canvas-note">数字设计示意 · 拖动图案调整位置</span>${btn('换物件','swap','canvas-change')}</div><div class="editor-tools"><div class="tool-tabs" role="tablist" aria-label="编辑工具">${[['compose','构图','move'],['material','器物','palette'],['motif','纹样','layers']].map(([id,label,ic])=>`<button role="tab" data-action="tool" data-id="${id}" aria-selected="${id===c.tool}">${icon(ic,17)}${label}</button>`).join('')}</div><div class="tool-panel" role="tabpanel" aria-label="编辑工具">${tools(c)}</div></div><div class="editor-footer">${btn('大图预览','preview','secondary')}${btn('保存作品 '+icon('arrow',18),'finish')}</div></section>`;}
function result(c){const w=c.w;if(!w)return empty('这件作品暂时找不到','可能已被删除，可返回“我的”查看其他记录。');const sub=c.s.submissions.find(x=>x.workId===w.id);return `<section class="page-content result-screen"><div class="result-heading">${tag('已保存到此浏览器')}<h1>${esc(w.title)}</h1><p>${M.category(w.category).name} · ${date(w.savedAt||w.createdAt)}</p></div><div class="result-art">${art(w)}</div>${w.idea?`<p class="work-idea">${esc(w.idea)}</p>`:''}<div class="two-actions">${btn(sub?'编辑为新副本':'继续编辑','edit-work','secondary',`data-id="${w.id}"`)}${btn('我的作品','mine')}</div>${btn('返回共创','home','text full')}<div class="optional-block"><div><span class="eyebrow">下一步 · 可选</span><h2>${sub?'已留存演示投稿':'让创作被看见'}</h2><p>${sub?'仅保存在本机，未发送馆方。':'先保存，再决定是否参与投稿。'}</p></div>${btn(sub?'查看状态':'演示投稿',sub?'submission':'submit','secondary',`data-id="${sub?.id||w.id}"`)}</div><p class="footer-note">数字设计不代表可直接制作。实体化仍需版权、馆方与工艺审核。</p></section>`;}
function points(c){const entries=[...c.s.ledger].reverse(),total=entries.reduce((n,x)=>n+x.points,0);return `<section class="page-content points-screen"><div class="page-title"><span class="eyebrow">GROWTH / 创作足迹</span><h1>每次创作，都有回响</h1></div><div class="points-hero"><span>我的演示积分</span><strong>${total}<small>分</small></strong><div><span>${c.s.works.length} 件作品 · ${c.s.submissions.length} 次演示投稿</span>${btn('积分规则','rules','text')}</div></div><p class="notice">仅为本地演示记录，不是馆方账户，也不代表正式文化权益。</p>${row('文化权益说明','展示、署名与实体化等正式权益均待馆方确认','rights')}<div class="section-heading"><h2>成长时间线</h2><span>${entries.length} 条记录</span></div>${entries.length?`<ol class="timeline">${entries.map(e=>`<li><div class="timeline-dot"></div><div><span class="eyebrow">${date(e.createdAt)}</span><h3>${e.label}</h3><p>${esc(e.title)}</p><small>来源 ${esc(e.sourceId.slice(-8))}</small></div><strong>+${e.points}</strong></li>`).join('')}</ol>`:empty('第一条记录，从创作开始','完成一件数字作品，即可看到可追溯的成长记录。')}</section>`;}
function mini(w,kind){return `<article class="work-card"><button class="work-cover" data-action="${kind==='drafts'?'resume':'view-work'}" data-id="${w.id}" aria-label="${kind==='drafts'?'继续编辑':'查看'}${esc(w.title||'未命名草稿')}">${art(w)}<span class="tag">${kind==='drafts'?'草稿':'已保存'}</span></button><div class="work-card-body"><h3>${esc(w.title||'未命名草稿')}</h3><p>${M.category(w.category).name} · ${date(w.updatedAt||w.savedAt)}</p><div>${btn(kind==='drafts'?'继续编辑':'查看作品',kind==='drafts'?'resume':'view-work','text',`data-id="${w.id}"`)}${ib('trash','delete','删除'+(kind==='drafts'?'草稿':'作品'),`data-id="${w.id}" data-kind="${kind}"`)}</div></div></article>`;}
function mine(c){const f=c.s.ui.filter||'works',counts=[c.s.works.length,c.s.drafts.length,c.s.submissions.length,c.s.favorites.length];let list='';if(f==='works'||f==='drafts')list=c.s[f].length?`<div class="work-grid">${[...c.s[f]].reverse().map(w=>mini(w,f)).join('')}</div>`:empty(f==='drafts'?'还没有草稿':'让第一件作品在这里安放',f==='drafts'?'编辑过程会自动保存，随时回来继续。':'选一件物品，让你的想法留在上面。');if(f==='submissions')list=c.s.submissions.length?c.s.submissions.slice().reverse().map(x=>row(x.snapshot.title,x.status+' · '+date(x.createdAt),'submission',`data-id="${x.id}"`)).join(''):empty('还没有演示投稿','先保存作品，再按自己的意愿参与。');if(f==='favorites')list=c.s.favorites.length?c.s.favorites.map(id=>{const i=M.getItem(id);return `<button class="catalog-row" data-action="choose" data-id="${i.id}">${A.object({itemId:i.id},true)}<span><strong>${i.name}</strong><small>${M.category(i.category).name} · 原创示意</small></span>${icon('arrow',18)}</button>`;}).join(''):empty('把喜欢的物件留下','在首页或物件详情点击收藏，方便下次找回。');return `<section class="page-content"><div class="page-title"><span class="eyebrow">MY ARCHIVE / 本地创作档案</span><h1>我的，再生之作</h1><p>每一份草稿，都值得被认真留下。</p></div><div class="my-tabs" role="group" aria-label="作品分组">${[['works','作品'],['drafts','草稿'],['submissions','投稿'],['favorites','收藏']].map(([id,label],i)=>btn(`${label} <small>${counts[i]}</small>`,'filter','',`data-id="${id}" aria-pressed="${f===id}"`)).join('')}</div>${list}<p class="footer-note">作品保存在当前浏览器。清除网站数据会删除本地记录，请使用固定浏览器与访问地址。</p>${row('关于这次共创','本地演示边界与素材说明','about')}</section>`;}
function catalog(mode){return M.categories.map(cat=>`<div class="catalog-section"><h3>${cat.name}<small>${cat.en}</small></h3>${M.items.filter(i=>i.category===cat.id).map(i=>`<button class="catalog-row" data-action="${mode==='swap'?'swap-select':'choose'}" data-id="${i.id}">${A.object({itemId:i.id},true)}<span><strong>${i.name}</strong><small>自绘示意 · ${cat.name}</small></span>${icon('arrow',18)}</button>`).join('')}</div>`).join('');}
function searchResults(q){const found=M.search(q);return !q.trim()?'<p class="search-empty">描述一种图案、颜色或物件，开始查找。</p>':found.length?found.map(i=>`<button class="catalog-row" data-action="choose" data-id="${i.id}">${A.object({itemId:i.id},true)}<span><strong>${i.name}</strong><small>${i.subtitle}</small></span>${icon('arrow',18)}</button>`).join(''):`<div class="search-empty"><h3>暂时没找到匹配物件</h3><p>试试“牡丹”“喜鹊”“邮票”或“糖纸”。</p>${btn('浏览全部物件','browse','secondary')}</div>`;}
window.Views={esc,btn,ib,icon,tag,date,row,empty,art,nav,header,detail,editor,tools,result,points,mine,catalog,searchResults};
})();

(function(root,factory){const api=factory();if(typeof module==='object'&&module.exports)module.exports=api;else root.FilmQueue=api;})(globalThis,()=>{
 'use strict';
 const radius=3,size=radius*2+1,mod=(n,m)=>(n%m+m)%m;

 function create(ids,currentId){return fill(Array.from({length:size},(_,key)=>({key,offset:key-radius})),ids,currentId);}
 function advance(rows,ids,currentId,step){return fill(rows.map(row=>({...row,offset:mod(row.offset-Math.round(step)+radius,size)-radius})),ids,currentId);}
 return {radius,size,create,advance};
});

<script>
/* A fixed lens over two independently moving paper photographs. */
(() => {
 'use strict';
 let host=null, animations=[], generation=0, progress=0, direction=1;
 const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
 const read=el=>{const s=getComputedStyle(el);return {transform:s.transform,opacity:s.opacity,filter:s.filter};};
 function sheet(p,dir,incoming){
  const q=incoming?1-p:p, arc=Math.sin(q*Math.PI);
  const x=(incoming?dir:-dir)*(118*q+7*arc), y=26*q+9*arc;
  const rz=(incoming?dir:-dir)*(12*q), ry=(incoming?dir:-dir)*18*q;
  const scale=1-.09*q;
  return {transform:`translate3d(${x}px,${y}px,${-22*arc}px) rotateZ(${rz}deg) rotateY(${ry}deg) scale(${scale})`,opacity:1,
   filter:`blur(${Math.max(1.15*q,Math.sin(q*Math.PI)*1.5).toFixed(3)}px) brightness(${(1-.22*q).toFixed(3)})`};
 }
 function stop(){animations.forEach(a=>a.cancel());animations=[];}
 function bind(win){if(host!==win){stop();host=win;progress=0;generation++;}}
 function make(item,photo,preview=false){const el=document.createElement('span');el.className='viewed-slide'+(preview?' preview-slide':'');el.dataset.id=item.id;el.innerHTML=photo(item);el.setAttribute('aria-hidden','true');return el;}
 function paint(el,values){Object.assign(el.style,values);}
 function play(el,frames,options={}){const a=el.animate(frames,{duration:740,easing:'cubic-bezier(.22,.64,.24,1)',...options});animations.push(a);return a;}
 function current(win){return win.querySelector('.viewed-slide:not(.leaving):not(.preview-slide)');}
 function glow(win,dir,p){win.style.setProperty('--lens-drift',`${-dir*p*12}px`);win.style.setProperty('--lens-motion',String(Math.sin(p*Math.PI)));}
 function drag(win,item,next,dx,photo){
  bind(win);if(reduced())return;
  const dir=dx<0?1:-1,p=Math.min(.86,Math.abs(dx)/150);
  const active=current(win);if(!active)return;
  if(progress===0||dir!==direction){stop();generation++;win.querySelectorAll('.viewed-slide.leaving,.preview-slide').forEach(el=>el.remove());}
  let preview=win.querySelector('.preview-slide');
  if(!preview||preview.dataset.id!==next.id){preview?.remove();preview=make(next,photo,true);win.prepend(preview);}
  active.style.zIndex='2';preview.style.zIndex='1';
  paint(active,sheet(p,dir,false));paint(preview,sheet(p,dir,true));glow(win,dir,p);
  direction=dir;progress=p;win.dataset.scrubProgress=p.toFixed(3);
 }
 function release(win){
  if(!win||win!==host||!progress)return;
  const active=current(win),preview=win.querySelector('.preview-slide'),dir=direction;
  const a=active&&read(active),b=preview&&read(preview),token=++generation;
  stop();progress=0;win.dataset.scrubProgress='0';glow(win,dir,0);
  if(active){paint(active,sheet(0,dir,false));play(active,[a,sheet(0,dir,false)],{duration:300});}
  if(preview){play(preview,[b,sheet(0,dir,true)],{duration:300,fill:'forwards'}).finished.then(()=>{if(token===generation)preview.remove();}).catch(()=>{});}
 }
 function transition(win,item,dir,photo,{animate=true,categoryChanged=false}={}){
  bind(win);const previous=current(win),preview=win.querySelector('.preview-slide');
  if(previous?.dataset.id===item.id){release(win);return;}
  const fromPrevious=previous&&read(previous),usePreview=preview?.dataset.id===item.id&&direction===dir;
  const fromIncoming=usePreview?read(preview):sheet(0,dir,true),start=usePreview?progress:0,token=++generation;
  stop();const incoming=usePreview?preview:make(item,photo);
  win.querySelectorAll('.viewed-slide').forEach(el=>{if(el!==previous&&el!==incoming)el.remove();});
  incoming.className='viewed-slide';incoming.style.zIndex='2';paint(incoming,sheet(1,dir,true));
  if(!incoming.parentNode)win.prepend(incoming);
  progress=0;win.dataset.scrubProgress='0';glow(win,dir,0);
  if(!animate||reduced()||!previous){previous?.remove();return;}
  previous.className='viewed-slide leaving';previous.style.zIndex='3';
  if(categoryChanged){
   play(previous,[{opacity:1},{opacity:0}],{duration:240,fill:'forwards'}).finished.then(()=>{if(token===generation)previous.remove();}).catch(()=>{});
   play(incoming,[{opacity:0},{opacity:1}],{duration:240});return;
  }
  const oldFrames=[],newFrames=[];
  for(let k=0;k<=24;k++){const t=k/24,p=start+(1-start)*t;oldFrames.push({offset:t,...sheet(p,dir,false)});newFrames.push({offset:t,...sheet(p,dir,true)});}
  oldFrames[0]={offset:0,...fromPrevious};newFrames[0]={offset:0,...fromIncoming};
  const duration=Math.max(300,760*(1-start));
  paint(previous,sheet(1,dir,false));
  play(previous,oldFrames,{duration,fill:'forwards'}).finished.then(()=>{if(token===generation)previous.remove();}).catch(()=>{});
  play(incoming,newFrames,{duration});
  const glass=win.querySelector('.glass-reflection');
  if(glass)play(glass,[{transform:`translateX(${-dir*8}px)`,opacity:.85},{transform:'translateX(0)',opacity:1}],{duration});
 }
 function reset(){stop();host=null;progress=0;generation++;}
 window.FilmOptics={drag,release,transition,reset};
})();

</script>
<script>
/* Category-scoped film carousel. The queue tail travels around a closed lower arc. */
(() => {
 'use strict';
 const M=window.Studio,A=window.Art,V=window.Views,Q=window.FilmQueue;
 let lastId=null,lastCategory=null,animations=[],generation=0,queue=[];
 const n=i=>String(i+1).padStart(2,'0');
 const group=c=>M.items.filter(i=>i.category===c.item.category);
 const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
 function photo(item){return `<span class="archive-photo">${A.object({itemId:item.id},true)}<span class="photo-grain" aria-hidden="true"></span></span>`;}
 function face(c){return `<div class="caption-face"><div class="archive-kicker">${M.category(c.item.category).name}系列<span> / </span>原创示意</div><h2 class="archive-name"><button class="archive-info" data-action="detail" aria-label="查看${c.item.name}的物件介绍">${c.item.name}${A.icon('chevron',12)}</button></h2></div>`;}
 function cta(c){return `${V.btn(`<span>用「${c.item.name}」共创</span>${A.icon('arrow',16)}`,'start')}${V.btn('用自己的图像开始','upload-home','text')}`;}

 function pose(d,width){const f=Math.min(1,width/390),a=Math.abs(d);return{x:Math.sign(d)*(75*Math.min(1,a)+Math.max(0,a-1)*44)*f,y:a*a*7,rotation:Math.sign(d)*Math.min(a*11,33),scale:1-Math.min(a,3)*.035,opacity:a===0?0:Math.max(.08,.98-a*.10-a*a*.05),blur:Math.pow(Math.max(0,a-1),1.6)*.7};}

 function layout(c,drag=0,skipOptics=false){const root=document.querySelector('.film-gallery');if(!root)return;const g=group(c);if(g.length<2)drag=0;window.Frame3D?.attach(root.querySelector('.film-viewer'),c.item.category,drag);root.dataset.drag=drag;const win=root.querySelector('.viewer-window');if(!skipOptics){if(drag&&g.length>1){const index=g.findIndex(i=>i.id===c.item.id),next=g[(index+(drag<0?1:-1)+g.length)%g.length];window.FilmOptics?.drag(win,c.item,next,drag,photo);}else window.FilmOptics?.release(win);}const nearest=new Map();[...queue].sort((a,b)=>Math.abs(a.offset)-Math.abs(b.offset)).forEach(row=>{if(!nearest.has(row.itemId))nearest.set(row.itemId,row.key);});root.querySelectorAll('.film-card').forEach(card=>{const row=queue.find(row=>row.key===Number(card.dataset.key));if(!row)return;paintCard(card,row);apply(card,pose(row.offset+Math.max(-.86,Math.min(.86,drag/150)),root.clientWidth),row.offset);const clone=nearest.get(row.itemId)!==row.key,hidden=clone||row.offset===0||g.length===1;card.dataset.clone=String(clone);card.dataset.single=String(g.length===1);card.tabIndex=hidden?-1:0;card.setAttribute('aria-hidden',String(hidden));});root.classList.toggle('dragging',Boolean(drag));}

 function rollCaption(c,dir,animate,token){const orbit=document.querySelector('.caption-orbit'),previous=orbit.querySelector('.caption-face');orbit.innerHTML=face(c);if(!animate)return;const current=orbit.firstElementChild;previous.setAttribute('aria-hidden','true');previous.querySelectorAll('button').forEach(b=>b.tabIndex=-1);previous.classList.add('leaving');orbit.append(previous);run(previous,[{transform:'rotateX(0deg)',opacity:1,filter:'blur(0px)'},{transform:`rotateX(${dir*105}deg)`,opacity:0,filter:'blur(2px)'}],{duration:760,fill:'forwards'}).finished.then(()=>{if(token===generation)previous.remove();}).catch(()=>{});run(current,[{transform:`rotateX(${-dir*105}deg)`,opacity:0,filter:'blur(2px)'},{transform:'rotateX(0deg)',opacity:1,filter:'blur(0px)'}],{duration:760});}
 function sync(c,requestedDirection=0){const gallery=document.querySelector('.film-gallery');if(!gallery)return;const g=group(c),index=g.findIndex(i=>i.id===c.item.id),categoryChanged=lastCategory!==c.item.category,changed=lastId!==c.item.id,oldIndex=g.findIndex(i=>i.id===lastId);let delta=categoryChanged?0:(index-oldIndex+g.length)%g.length;if(delta>g.length/2)delta-=g.length;const step=categoryChanged?0:(requestedDirection||delta),dir=Math.sign(step)||1,animate=(changed||step!==0)&&!reduced(),token=++generation;const oldQueue=queue.map(row=>({...row}));

 if(animate&&!categoryChanged){const center=gallery.querySelector('.film-viewer').getBoundingClientRect(),controls=gallery.querySelector('.gallery-controls').getBoundingClientRect(),lower=controls.top-(center.top+center.height/2)-29;gallery.querySelectorAll('.film-card').forEach(card=>{const key=Number(card.dataset.key),a=oldQueue.find(row=>row.key===key).offset,b=queue.find(row=>row.key===key).offset,start=oldTransforms.get(key)?.pose||pose(a,gallery.clientWidth),end=pose(b,gallery.clientWidth),wrap=dir>0?b>a:b<a,frames=[];for(let k=0;k<=32;k++){const t=k/32;let p;if(wrap){const travel=(1-Math.cos(t*Math.PI))/2;p={x:start.x+(end.x-start.x)*travel,y:start.y+(end.y-start.y)*t+Math.sin(t*Math.PI)*(lower-(start.y+end.y)/2),rotation:start.rotation+(end.rotation-start.rotation)*travel,scale:start.scale+(end.scale-start.scale)*t-Math.sin(t*Math.PI)*.06,opacity:.98};}else{p={x:start.x+(end.x-start.x)*t,y:start.y+(end.y-start.y)*t,rotation:start.rotation+(end.rotation-start.rotation)*t,scale:start.scale+(end.scale-start.scale)*t,opacity:start.opacity+(end.opacity-start.opacity)*t};}const targetOpacity=b===0?0:end.opacity,opacity=Math.min(1,start.opacity+(targetOpacity-start.opacity)*t+(wrap?Math.sin(t*Math.PI)*.35:0));const blur=Math.max(0,(start.blur||0)+(end.blur-(start.blur||0))*t-(wrap?Math.sin(t*Math.PI)*1.8:0));frames.push({offset:t,transform:transform(p),opacity,filter:`blur(${blur}px)`});}if(oldTransforms.has(key)){frames[0].transform=oldTransforms.get(key).transform;frames[0].opacity=oldTransforms.get(key).opacity;}if(wrap)card.style.zIndex='7';run(card,frames).finished.then(()=>{if(token===generation)card.style.zIndex=String(5-Math.abs(b));}).catch(()=>{});});}
 const win=gallery.querySelector('.viewer-window');win.setAttribute('aria-label',`查看${c.item.name}的物件介绍`);
 window.FilmOptics.transition(win,c.item,dir,photo,{animate:changed&&animate,categoryChanged});
 rollCaption(c,dir,animate&&!categoryChanged,token);lastId=c.item.id;lastCategory=c.item.category;
 gallery.querySelector('.viewer-number').textContent=n(index);gallery.querySelector('.reel-progress b').textContent=n(index);gallery.querySelector('.reel-progress>span').textContent=n(g.length-1);gallery.querySelectorAll('.gallery-controls button').forEach(b=>b.disabled=g.length<2);gallery.querySelector('.gesture-hint').textContent=g.length<2?'本系列暂有 1 件 · 可点选其他品类':'左右轻划 · 浏览本系列';document.querySelector('.home-cta').innerHTML=cta(c);document.querySelectorAll('.category-scroll button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===c.item.category)));const fav=document.querySelector('.category-bar [data-action=favorite]');fav.setAttribute('aria-pressed',String(c.s.favorites.includes(c.item.id)));fav.setAttribute('aria-label',c.s.favorites.includes(c.item.id)?'取消收藏':'收藏物件');
 }

<script>
/* Application coordinator: routes, atomic actions, editor gestures and recovery. */
(() => {
'use strict';
const M=window.Studio,S=window.LocalStore,V=window.Views,$=s=>document.querySelector(s);
let state,page='discover',tool='compose',resultId=null,saveLabel='已保存到本机',error='',loaded=false,busy=false,dirty=false,revision=0,saveTimer,toastTimer,dialogTrigger,modal='',parent='discover',detailParent='discover',resultParent='mine',uploadFromHome=false,scrolls={},rangeStart=null,drag=null,swipe=null,suppressClick=false;
const draft=()=>state?.drafts.find(d=>d.id===state.ui.activeDraftId);
const selected=()=>{const group=M.items.filter(i=>i.category===state.ui.category);return group.find(i=>i.id===state.ui.positions[state.ui.category])||group[0]||M.items[0];};
const context=()=>({s:state,page,tool,item:selected(),d:draft(),w:state.works.find(w=>w.id===resultId),saveLabel});
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3500);}
function status(label){saveLabel=label;if($('#save-status'))$('#save-status').textContent=label;}
function report(e){error=e?.message||String(e);if(!error.includes('本地')&&!error.includes('浏览器'))error='未能保存到本机。请保留页面，释放空间或恢复浏览器存储权限后重试。';$('#storage-banner span').textContent=error;$('#storage-banner').hidden=false;status('保存失败 · 请重试');if($('#dialog').open)dialogError(error);}
function clearError(){error='';$('#storage-banner').hidden=true;}
async function save(){clearTimeout(saveTimer);if(!loaded)return false;const rev=revision;status('正在保存…');try{await S.commit(state);if(rev===revision){dirty=false;status('已保存到本机');clearError();}return true;}catch(e){report(e);return false;}}
function changed(delay=250){revision++;dirty=true;status('正在保存…');clearTimeout(saveTimer);if(delay===0)save();else saveTimer=setTimeout(save,delay);}
async function atomic(action){if(busy)return null;busy=true;$('.app').dataset.busy='true';clearTimeout(saveTimer);const candidate=M.copy(state);try{const value=action(candidate);await S.commit(candidate);state=candidate;revision++;dirty=false;status('已保存到本机');clearError();return {value};}catch(e){report(e);return null;}finally{busy=false;$('.app').dataset.busy='false';}}
function render(){if(!loaded)return;window.Frame3D?.detach();window.FilmOptics?.reset();$('.app').classList.toggle('is-editor',page==='editor');$('#header').innerHTML=V.header(context());$('#main').className=page==='discover'?'home-main':page==='editor'?'editor-main':'';$('#main').innerHTML=({discover:V.home,detail:V.detail,editor:V.editor,result:V.result,points:V.points,mine:V.mine}[page]||V.home)(context());$('#nav').hidden=page==='editor';$('#nav').innerHTML=V.nav(['discover','points','mine'].includes(page)?page:page==='result'?'mine':'discover');if(page==='discover'){window.FilmHome?.layout(context());}if(page==='discover')$('.category-scroll [aria-pressed=true]')?.scrollIntoView({block:'nearest',inline:'nearest'});if(draft()?.imageId&&!S.image(draft().imageId)&&page==='editor')toast('此草稿的图片未能恢复，可在“纹样”中重新上传。');}
function routeString(p=page){return p==='result'?'result/'+encodeURIComponent(resultId||''):p;}
function navigate(p,{replace=false,skipSave=false}={}){if(busy)return;close();scrolls[page]=$('#main').scrollTop;page=p;state.ui.route=routeString();if(!skipSave)changed(0);const hash='#'+routeString();if(location.hash!==hash){if(replace)location.replace(hash);else location.hash=hash;}render();$('#main').scrollTop=scrolls[page]||0;$('#main').focus({preventScroll:true});}
async function back(){if(page==='editor'){if(!await save())return;return navigate(parent);}if(page==='detail')return navigate(detailParent);if(page==='result')return navigate(resultParent);navigate('discover');}
function selectItem(id){const i=M.getItem(id);state.ui.category=i.category;state.ui.positions[i.category]=i.id;changed(0);}
function cycle(delta){const i=selected(),g=M.items.filter(item=>item.category===i.category);if(g.length<2){window.FilmHome.layout(context());return;}selectItem(g[(g.indexOf(i)+delta+g.length)%g.length].id);window.FilmHome.sync(context(),delta);}
function open(title,body,type='generic'){if(!$('#dialog').open)dialogTrigger=document.activeElement;modal=type;$('#dialog').innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2>${V.ib('close','close','关闭')}</div><div class="dialog-body">${body}<p class="dialog-error" role="alert" hidden></p></div>`;if(!$('#dialog').open)$('#dialog').showModal();}
function close(){if($('#dialog').open)$('#dialog').close();modal='';if(dialogTrigger?.isConnected)dialogTrigger.focus({preventScroll:true});}
function dialogError(msg){const el=$('.dialog-error');if(el){el.textContent=msg;el.hidden=false;}}
function showSearch(){open('问一问，找件喜欢的物品',`<p>在当前素材库内，按名称、颜色与图案关键词查找。</p><label class="field"><span>描述你想找的物件</span><div class="search-top"><input class="input" id="search-query" placeholder="例如：带牡丹的搪瓷盘" value="${V.esc(state.ui.query)}">${V.ib('close','clear-search','清空搜索')}</div></label><div class="search-examples">${['带牡丹的搪瓷盘','蓝色的鸟','喜糖包装'].map(q=>V.btn(q,'example','',`data-query="${q}"`)).join('')}</div><div id="search-results">${V.searchResults(state.ui.query)}</div><p class="footer-note">本地关键词匹配，未接入 AI 服务。</p>`,'search');}
function showUpload(home=false){uploadFromHome=home;open('用自己的图像共创',`<p>选择你拥有合法使用权的图像，放进当前${M.category(home?selected().category:draft().category).name}画布。</p><p class="notice">支持 JPG、PNG、WebP，最大 12 MB。图片仅保存在本机，不上传服务器。</p><label class="check-row"><input type="checkbox" id="image-consent"><span>我确认拥有这张图像的合法使用权；后续投稿授权将单独确认。</span></label>${V.btn('选择图像','pick-file','primary full')}${V.btn('暂时不用','close','text full')}`,'upload');}
async function start(itemId=selected().id,own=false){const source=page==='detail'?'detail':page==='mine'?'mine':'discover';const res=await atomic(s=>M.addDraft(s,itemId));if(!res)return false;parent=source;tool='compose';navigate('editor');if(own)showUpload(false);return true;}
function update(changes){const d=draft();if(!d)return;M.edit(d,changes);changed();render();}
function previewUpdate(next){$('#work-preview').innerHTML=V.art(next);for(const key of ['scale','rotation','x','y']){const output=$(`[data-output="${key}"]`);if(output)output.textContent=next[key]+(key==='scale'?'%':key==='rotation'?'°':'');}}
function showFinish(){const d=draft();open('保存这次创作',`<label class="field"><span>作品名称 <small>必填 · 最多 24 字</small></span><input class="input" id="work-title" maxlength="24" value="${V.esc(d.title)}" placeholder="给这件作品取个名字"></label><label class="field"><span>创作想法 <small>选填</small></span><textarea class="input" id="work-idea" maxlength="180" rows="3" placeholder="想留下什么样的记忆？">${V.esc(d.idea)}</textarea></label><p>保存后可在“我的”中查看或继续编辑，投稿由你另外决定。</p>${V.btn('保存到我的作品','complete','primary full')}${V.btn('继续调整','close','text full')}`,'finish');}
function showSubmission(id){const sub=state.submissions.find(x=>x.id===id);if(!sub)return;open('演示投稿记录',`<span class="state-badge">${sub.status}</span><div class="large-preview">${V.art(sub.snapshot)}</div><h3>${V.esc(sub.snapshot.title)}</h3><p>${V.date(sub.createdAt)} · 记录 ${V.esc(sub.id.slice(-8))}</p><p class="notice">已保留本地作品快照。没有发送至馆方，也没有进行审核、入选或生产。</p><p>继续修改作品会新建副本，保留本次投稿的原始版本。</p>${V.btn('关闭记录','close','primary full')}${V.btn('删除这条演示记录','delete','text danger full',`data-kind="submissions" data-id="${sub.id}"`)}`,'submission');}
function confirmDelete(kind,id){const record=state[kind]?.find(x=>x.id===id);if(!record)return;const title=record.title||record.snapshot?.title||'未命名草稿';open('确认删除'+({drafts:'草稿',works:'作品',submissions:'演示投稿记录'}[kind]),`<p>将从此浏览器删除“${V.esc(title)}”。此操作无法撤销。</p><p>其他草稿、作品与成长记录会保留。${kind==='works'&&state.submissions.some(x=>x.workId===id)?'已留存的演示投稿快照也会保留。':''}</p>${V.btn('确认删除','confirm-delete','danger full',`data-kind="${kind}" data-id="${id}"`)}${V.btn('保留，返回','close','secondary full')}`,'delete');}
async function handle(action,el){if(busy&&action!=='close')return;const id=el?.dataset.id;
switch(action){
case 'navigate':return navigate(el.dataset.page);
case 'home':return navigate('discover');
case 'mine':state.ui.filter='works';return navigate('mine');
case 'back':return back();
case 'close':return close();
case 'retry':if(!loaded)return boot();if(await save()){toast('本地记录已保存');render();}return;
case 'prev':return cycle(-1);
case 'next':return cycle(1);
case 'category':state.ui.category=id;changed(0);return window.FilmHome.sync(context());
case 'film-select':if(M.getItem(id).category!==selected().category)return;selectItem(id);return window.FilmHome.sync(context(),Number(el.dataset.offset)||0);
case 'detail':detailParent=page;return navigate('detail');
case 'favorite':{const item=selected();state.favorites=state.favorites.includes(item.id)?state.favorites.filter(x=>x!==item.id):[...state.favorites,item.id];changed(0);return page==='discover'?window.FilmHome.sync(context()):render();}
case 'choose':selectItem(id);return navigate('discover');
case 'browse':return open('全部物件',`<p>四类示意画布，共 ${M.items.length} 件创作起点。选择后回到物件主舞台。</p>${V.catalog()}`,'browse');
case 'search':return showSearch();
case 'clear-search':case 'example':state.ui.query=action==='example'?el.dataset.query:'';$('#search-query').value=state.ui.query;$('#search-results').innerHTML=V.searchResults(state.ui.query);changed();$('#search-query').focus();return;
case 'start':return start();
case 'upload-home':return showUpload(true);
case 'upload':return showUpload(false);
case 'pick-file':if(!$('#image-consent').checked)return dialogError('请先确认图像使用权。');$('#image-file').value='';$('#image-file').click();return;
case 'tool':tool=id;return render();
case 'color':return update({color:id});
case 'canvas':return update({canvas:id});
case 'replace':M.replace(draft(),id);changed();return render();
case 'undo':M.undo(draft());changed();return render();
case 'redo':M.redo(draft());changed();return render();
case 'reset':return update({scale:100,x:0,y:0,rotation:0});
case 'swap':return open('换一件物品，继续创作',`<p>同类更换会保留构图并支持撤销。跨类别时先保存当前草稿，再建立新草稿。</p>${V.catalog('swap')}`,'swap');
case 'swap-select':if(M.getItem(id).category===draft().category){M.replace(draft(),id);changed();close();render();return;}{const res=await atomic(s=>M.addDraft(s,id));if(res){close();tool='compose';render();toast('原草稿已保留，新画布已建立');}}return;
case 'exit':return open('暂时结束创作？',`<p>你可以保存进度，下次从“我的 · 草稿”继续。</p>${V.btn('保存草稿并退出','save-exit','primary full')}${V.btn('继续创作','close','secondary full')}${V.btn('放弃本次草稿','discard','text danger full')}`,'exit');
case 'save-exit':if(await save())navigate(parent);return;
case 'discard':return confirmDelete('drafts',draft().id);
case 'preview':return open('数字作品预览',`<div class="large-preview">${V.art(draft())}</div><p class="notice">这是视觉设计预览。实体制作仍需授权、设计与工艺审核。</p>${V.btn('返回调整','close','primary full')}`,'preview');
case 'finish':return showFinish();
case 'complete':{const name=$('#work-title').value.trim();if(!name){dialogError('请为作品取个名字。');$('#work-title').focus();return;}M.edit(draft(),{title:name,idea:$('#work-idea').value});const res=await atomic(s=>M.complete(s,s.ui.activeDraftId,name));if(res){resultId=res.value.id;resultParent='mine';navigate('result');toast('作品与成长记录已保存');}return;}
case 'resume':{const d=state.drafts.find(x=>x.id===id);if(!d)return;state.ui.activeDraftId=id;parent='mine';tool='compose';navigate('editor');return;}
case 'view-work':resultId=id;resultParent='mine';return navigate('result');
case 'edit-work':{const res=await atomic(s=>M.resumeWork(s,id));if(res){parent='result';tool='compose';navigate('editor');}return;}
case 'filter':state.ui.filter=id;changed(0);return render();
case 'delete':return confirmDelete(el.dataset.kind,id);
case 'confirm-delete':{const kind=el.dataset.kind,wasCurrent=kind==='drafts'&&id===state.ui.activeDraftId;const res=await atomic(s=>M.remove(s,kind,id));if(res){close();if(wasCurrent)navigate(parent==='result'?'mine':parent);else render();toast('已删除，其他记录已保留');}return;}
case 'submit':return open('参加演示投稿',`<p>本次操作只在当前浏览器建立投稿记录与作品快照，不向馆方传输。</p><p class="notice">正式展示、署名、改编或实体化须另行确认授权范围，并完成馆方与工艺审核。</p><label class="check-row"><input type="checkbox" id="submission-consent"><span>我确认图像使用权，并同意在本机保存这次演示投稿快照；这不构成对外发布授权。</span></label>${V.btn('确认演示投稿','confirm-submit','primary full',`data-id="${id}"`)}${V.btn('暂不投稿','close','text full')}`,'submit');
case 'confirm-submit':if(!$('#submission-consent').checked)return dialogError('请先阅读并确认演示授权说明。');{const res=await atomic(s=>M.submit(s,id,true));if(res){render();showSubmission(res.value.id);toast('演示投稿已保存，未发送馆方');}}return;
case 'submission':return showSubmission(id);
case 'rules':return open('演示积分规则',`<p>积分仅用于演示成长记录，尚未形成馆方规则。</p>${Object.values(M.rules).map(r=>`<div class="rule-row"><span>${r.name}</span><strong>+${r.points}</strong></div>`).join('')}<p class="notice">每个设计首次完成和首次投稿分别记一次。重复保存、重复投稿不重复发分；删除记录不重置已计分事件。</p>${V.btn('明白了','close','primary full')}`);
case 'rights':return open('文化权益 · 待馆方确认',`<p>创作记录是参与过程的留存。未来的署名展示、文化活动或实体化机会，需由馆方明确规则和授权。</p><p class="notice">当前没有已开放的兑换权益，也不以本地演示积分承诺任何奖品或资格。</p>${V.btn('返回积分','close','primary full')}`);
case 'about':return open('关于物之再生',`<p>面向上海工业博物馆语境的工业文化共创设计研究，以老搪瓷为首个示范，探索从文化记忆到数字作品的转化。</p><p>当前素材为自绘示意，参考图只用于设计方向。对应馆藏、年代、版权和工艺仍需核实。</p><p class="notice">本地可操作原型：草稿、作品、图片、积分和投稿保存在当前浏览器，不进行云同步或实际馆方审核。正式文化权益尚未开放。</p><p>本轮为可持续调整的阶段性方案。共创之外的资料征集和价值评定另行设计。</p>${V.btn('继续体验','close','primary full')}`);
}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;if(suppressClick&&el.closest('#object-stage')){e.preventDefault();return;}handle(el.dataset.action,el).catch(report);});
document.addEventListener('input',e=>{if(!loaded||busy)return;const el=e.target;if(el.id==='search-query'){state.ui.query=el.value;$('#search-results').innerHTML=V.searchResults(el.value);changed();}if(el.id==='work-title'||el.id==='work-idea'){M.edit(draft(),{[el.id==='work-title'?'title':'idea']:el.value});changed();}if(el.dataset.field){const d=draft();if(!rangeStart)rangeStart=M.snapshot(d);const candidate={...d,[el.dataset.field]:Number(el.value)};previewUpdate(candidate);}});
document.addEventListener('change',e=>{if(e.target.dataset.field){M.edit(draft(),{[e.target.dataset.field]:Number(e.target.value)});rangeStart=null;changed();render();}});
document.addEventListener('pointerdown',e=>{if(busy||!loaded)return;if(e.target.closest('#work-preview')){drag={startX:e.clientX,startY:e.clientY,draft:M.snapshot(draft()),target:e.target.closest('#work-preview'),next:null};drag.target.setPointerCapture(e.pointerId);e.preventDefault();}else if(e.target.closest('#object-stage')){swipe={x:e.clientX,y:e.clientY,time:performance.now(),id:e.pointerId,target:e.target.closest('#object-stage')};}});
document.addEventListener('pointermove',e=>{if(swipe&&page==='discover'){const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;if(Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy)){if(!swipe.target.hasPointerCapture(swipe.id))swipe.target.setPointerCapture(swipe.id);window.FilmHome.layout(context(),Math.max(-160,Math.min(160,dx)));}}if(!drag)return;const rect=drag.target.getBoundingClientRect(),factor=340/Math.max(200,rect.width);drag.next={...draft(),x:Math.max(-60,Math.min(60,Math.round(drag.draft.x+(e.clientX-drag.startX)*factor))),y:Math.max(-60,Math.min(60,Math.round(drag.draft.y+(e.clientY-drag.startY)*factor)))};previewUpdate(drag.next);});
document.addEventListener('pointerup',e=>{if(drag){if(drag.next){M.edit(draft(),{x:drag.next.x,y:drag.next.y});changed();}drag=null;render();}if(swipe){const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;if((Math.abs(dx)>35||(Math.abs(dx)>16&&Math.abs(dx)/Math.max(1,performance.now()-swipe.time)>.35))&&Math.abs(dx)>Math.abs(dy)*1.4){suppressClick=true;cycle(dx<0?1:-1);setTimeout(()=>suppressClick=false,250);}else window.FilmHome.layout(context());swipe=null;}});
document.addEventListener('pointercancel',()=>{drag=null;swipe=null;if(loaded&&page==='editor')render();if(loaded&&page==='discover')window.FilmHome.layout(context());});
$('#dialog').addEventListener('cancel',e=>{if(busy){e.preventDefault();return;}modal='';});
async function compress(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('请选择 JPG、PNG 或 WebP 图片。');if(file.size>12*1024*1024)throw Error('图片超过 12 MB，请换一张较小的图片。');const url=URL.createObjectURL(file);try{const image=new Image();image.src=url;try{await image.decode();}catch{throw Error('这张图片无法解码，可能已损坏。请重新选择 JPG、PNG 或 WebP。');}if(!image.width||!image.height)throw Error('无法读取这张图片，请重新选择。');const ratio=Math.min(1,1400/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.round(image.width*ratio);canvas.height=Math.round(image.height*ratio);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('无法处理图片，请重试。')),'image/png'));}finally{URL.revokeObjectURL(url);}}
$('#image-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;const home=uploadFromHome;busy=true;$('.app').dataset.busy='true';dialogError('正在读取图片…');try{const blob=await compress(file);const imageId=await S.saveImage(blob);busy=false;const res=await atomic(s=>{const d=home?M.addDraft(s,selected().id):s.drafts.find(x=>x.id===s.ui.activeDraftId);M.edit(d,{imageId,imageName:file.name});return d;});if(res){parent=home?'discover':parent;tool='compose';navigate('editor');toast('图像已保存到本机');}}catch(err){dialogError(err.message||'图片读取失败，请重新选择。');}finally{busy=false;$('.app').dataset.busy='false';}});
window.addEventListener('hashchange',async()=>{if(!loaded||location.hash==='#'+routeString())return;if(page==='editor'&&!await save()){history.replaceState({},'','#editor');return;}close();scrolls[page]=$('#main').scrollTop;readRoute();render();$('#main').scrollTop=scrolls[page]||0;});
function readRoute(){const [route,id]=location.hash.slice(1).split('/');page=['discover','detail','editor','result','points','mine'].includes(route)?route:'discover';if(page==='editor'&&!draft())page='mine';if(page==='result')resultId=decodeURIComponent(id||state.ui.resultId||'');state.ui.route=routeString();if(resultId)state.ui.resultId=resultId;}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&dirty)save();});window.addEventListener('pagehide',()=>{if(dirty)save();});window.addEventListener('beforeunload',e=>{if(dirty||busy){e.preventDefault();e.returnValue='';}});
async function boot(){try{state=await S.load();await S.preload(state);loaded=true;clearError();readRoute();render();if(state.legacyImported&&!state.ui.legacyNotice){state.ui.legacyNotice=true;changed();toast('已导入旧版作品，旧数据仍保留');}}catch(e){loaded=false;report(e);$('#main').innerHTML='<div class="loading"><strong>暂时无法打开档案</strong><p>为保护原有记录，已暂停写入。请保留此页面，恢复浏览器存储权限后点击上方“重试”。</p></div>';}}
window.addEventListener('resize',()=>{if(loaded&&page==='discover')window.FilmHome.layout(context());});
document.addEventListener('keydown',e=>{if(page==='discover'&&e.target.closest('.film-gallery')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1);}});
boot();
})();

</script>
</body></html>
